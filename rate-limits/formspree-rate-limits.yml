specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Formspree
providerId: formspree
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Forms
- Backend
- Static Sites
- Email
- Webhooks
- Rate Limiting
- Quotas
- Throttling
description: >-
  Formspree's primary throttle is the per-plan monthly submission ceiling
  (50 on Free; raised on Personal/Professional/Business). Formspree sends
  email warnings at 50%, 75% and 90% of the cap, and submissions above the
  cap are rejected. The Forms API itself uses Bearer auth with public read-
  only and Master keys; per-second numeric quotas are not publicly enumerated.
notes: >-
  Formspree's spam controls (reCAPTCHA, Akismet) and Plugins also bound
  effective submission throughput; Free archives only retain 30 days of data.
sources:
- https://help.formspree.io/hc/en-us/articles/47605896654227-Account-limits
- https://help.formspree.io/sections/the-forms-api/
responseCodes:
  throttled: 429
limits:
- name: Free plan submissions/month
  scope: account
  metric: submissions/month
  limit: 50
- name: Free plan archive retention
  scope: account
  metric: days
  limit: 30
- name: Forms API requests
  scope: api_token
  metric: requests
  limit: see Formspree docs
  notes: Per-token throttle; 429 on excess.
policies:
- name: Threshold notifications
  description: Warnings emailed at 50%, 75%, 90% of monthly submission cap.
- name: Backoff Strategy
  description: Honor 429 responses with exponential backoff.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
