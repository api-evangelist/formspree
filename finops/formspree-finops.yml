description: >-
  FOCUS-aligned FinOps profile for Formspree. Billing is a flat plan fee
  (Free or one of three paid tiers — Personal, Professional, Business) with
  the monthly submission cap as the dominant constraint. There are no usage
  overages — you are throttled, not metered, above plan cap.
notes: >-
  Cost optimisation is mostly about right-sizing the tier to actual monthly
  submissions. Free's 30-day archive retention is the chief operational
  optimisation — schedule exports if downgrading or near-archive age.
sources:
- https://formspree.io/plans
