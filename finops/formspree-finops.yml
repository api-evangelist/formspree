serviceCategory: Forms / Backend
billingModel:
  pricingCategory: Subscription (capped)
  billingFrequency: Monthly / Annual
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Formspree
  ServiceCategory: Forms
  ProviderName: Formspree
  PublisherName: Formspree
  InvoiceIssuerName: Formspree
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingUnit: plan-month
meters:
- name: plan_subscription
  description: Flat monthly plan fee.
  unit: month
  aggregation: sum
  dimensions:
  - account
  - plan
- name: monthly_submissions
  description: Submissions counted against plan cap (50 on Free).
  unit: submission
  aggregation: sum
  dimensions:
  - account
  - form
- name: archive_retention
  description: Days of submission history retained (30 on Free; full on paid).
  unit: days
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Use Formspree dashboard usage page; threshold emails at 50/75/90% of cap.
- name: Allocation
  description: Use per-form hashids to allocate by team / project.
- name: Optimization
  description: Right-size plan tier to actual monthly submissions; schedule exports before archive expiry on Free.
- name: Accountability
  description: Assign account owner; alert on threshold notifications.
