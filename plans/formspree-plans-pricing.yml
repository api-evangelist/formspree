description: >-
  Formspree sells a Free tier plus three paid tiers — Personal, Professional
  and Business — tiered by monthly submission cap and feature set. The free
  plan offers 50 submissions/month with 30-day archive. Paid plans expose
  programmatic Forms API keys.
notes: >-
  Public list prices vary across third-party comparison sources. The most
  commonly cited values as of 2026-05-08 are reflected here, but prices on
  formspree.io/plans should be checked at contract time. Reconciled flagged
  false until verified directly on the live pricing page.
