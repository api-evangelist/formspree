  - AJAX
  properties:
  - type: Documentation
    url: https://help.formspree.io/hc/en-us/articles/360015233153-Form-Submissions-API
- aid: formspree:forms-api
  name: Formspree Forms API
  description: >-
    REST API for retrieving submissions and managing forms. Endpoints under /api/0/forms/<hashid>/. Bearer
    auth using a public read-only API key or a Master API key (paid plans only). Supports since/limit/offset.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.formspree.io/sections/the-forms-api/
