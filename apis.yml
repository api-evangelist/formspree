apis:
- aid: formspree:submission
  name: Formspree Form Submission Endpoint
  description: >-
    Public POST endpoint per form. Accepts standard HTML form posts and cross-origin AJAX (Accept: application/json)
    and returns JSON. No auth for the submission itself; per-form spam controls.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.formspree.io/hc/en-us/articles/360015233153-Form-Submissions-API
