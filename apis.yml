name: Formspree
kind: company
description: >-
  Formspree is a form backend for static and Jamstack sites. Two API surfaces
  matter: (1) the public form-submission endpoint (formspree.io/f/{hashid})
  that accepts POST submissions and returns JSON when the Accept header is
  set, and (2) the Forms API (formspree.io/api/0/...) for programmatic
  submission retrieval, export and form management. Plugins and the Formspree
  CLI extend the surface.
